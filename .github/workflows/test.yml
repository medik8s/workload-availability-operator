name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Check the selected Go toolchain
        run: hack/verify-go-toolchain.sh

      - name: Prepare Go dependencies
        run: go mod download

      - name: Verify operand manifests and run offline tests
        run: make verify-operand-manifests test-offline

      - name: Running Tests
        run: |
          go mod tidy
          make test

  # The CSV minimum is Kubernetes 1.29. Run the reconciler and the FAR admission suites
  # against that API server and against the default version.
  envtest:
    name: envtest on Kubernetes ${{ matrix.kubernetes }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.29", "1.36"]
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Check the selected Go toolchain
        run: hack/verify-go-toolchain.sh

      - name: Run the envtest suites
        run: make test-envtest ENVTEST_K8S_VERSION=${{ matrix.kubernetes }}
