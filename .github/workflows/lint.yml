name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Check the selected Go toolchain
        run: hack/verify-go-toolchain.sh

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0
