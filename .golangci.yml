version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      # Copied from FAR with minimal adaptation; see internal/webhooks/far/SOURCE.md.
      - internal/webhooks/far/v1alpha1
      # Copied from NHC with minimal adaptation; see internal/webhooks/nhc/SOURCE.md.
      - internal/webhooks/nhc/v1alpha1
      - internal/webhooks/nhc/cluster
      - internal/webhooks/nhc/annotations
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
