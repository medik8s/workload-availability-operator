# operator-sdk reads this Service to find the Deployment and the ports of the webhook definitions.
# The Makefile bundle target removes it from the bundle: the registrations point at the Service
# that OLM creates for the webhook definitions.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: workload-availability-operator
    app.kubernetes.io/managed-by: kustomize
  name: webhook-service
  namespace: system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: workload-availability-operator
