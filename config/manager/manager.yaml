apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: workload-availability-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: workload-availability-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: workload-availability-operator
  # Each replica serves FAR admission. Only the leader reconciles.
  replicas: 2
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: workload-availability-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      # Prefer different nodes for the two replicas. This is not a requirement, so both can start on one node.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    control-plane: controller-manager
                    app.kubernetes.io/name: workload-availability-operator
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Collect the fence agent names from the selected FAR image for FAR admission.
        # The command reads directory entries only. It does not start the FAR manager or a fence agent.
        # hack/sync-operand-images.sh keeps this image equal to RELATED_IMAGE_FAR_MANAGER.
        - name: far-agent-inventory
          image: quay.io/medik8s/fence-agents-remediation-operator:wao
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              out=/var/run/wao/far-agent-inventory
              cd /usr/sbin
              ls -1d -- fence_* > "$out/agents.txt.tmp"
              mv "$out/agents.txt.tmp" "$out/agents.txt"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: far-agent-inventory
              mountPath: /var/run/wao/far-agent-inventory
      containers:
        - command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            - --far-agent-inventory=/var/run/wao/far-agent-inventory/agents.txt
            # OLM mounts the serving certificate of the FAR admission webhooks at this path.
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
          # Operand images must equal repository:tag selected in operands.yaml.
          # They are not configurable through any API field.
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELATED_IMAGE_NHC_MANAGER
              value: quay.io/medik8s/node-healthcheck-operator:wao
            - name: RELATED_IMAGE_NHC_CONSOLE
              value: quay.io/medik8s/node-remediation-console:wao
            - name: RELATED_IMAGE_SNR_MANAGER
              value: quay.io/medik8s/self-node-remediation-operator:wao
            - name: RELATED_IMAGE_SBR_MANAGER
              value: quay.io/medik8s/storage-based-remediation-operator:wao
            - name: RELATED_IMAGE_SBR_AGENT
              value: quay.io/medik8s/storage-based-remediation-agent:wao
            - name: RELATED_IMAGE_FAR_MANAGER
              value: quay.io/medik8s/fence-agents-remediation-operator:wao
            - name: RELATED_IMAGE_MDR_MANAGER
              value: quay.io/medik8s/machine-deletion-remediation-operator:wao
            - name: RELATED_IMAGE_NMO_MANAGER
              value: quay.io/medik8s/node-maintenance-operator:wao
          image: controller:latest
          name: manager
          ports:
            - name: webhook-server
              containerPort: 9443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          # TODO(user): Configure the resources accordingly based on the project requirements.
          # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: far-agent-inventory
              mountPath: /var/run/wao/far-agent-inventory
              readOnly: true
      volumes:
        - name: far-agent-inventory
          emptyDir:
            sizeLimit: 1Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
